<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tulipanes amarillitos así bien bonitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Karla:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="escena" aria-hidden="true">
    <div class="sol">
      <div class="carita">
        <div class="cachete izq"></div>
        <div class="cachete der"></div>
        <div class="ojo izq"></div>
        <div class="ojo der"></div>
        <div class="pico"></div>
      </div>
    </div>
    <div class="nubes" id="nubes"></div>
    <div class="pajaros" id="pajaros"></div>
    <div class="campo"></div>
    <div class="jardin" id="jardin"></div>
  </div>

  <input type="checkbox" id="abrir" class="oculto">

  <div class="wrapper">
    <label for="abrir" class="telon" aria-hidden="true"></label>

    <label for="abrir" class="sobre">
      <div class="fondo"></div>

      <div class="carta" aria-hidden="true">
        <p class="saludo">Para ti, Danielita</p>
        <span class="texto">Porque eres la mejor, la más bonita y siempre brillas, incluso más que este solecito con forma de pollito.</span>
        <br>
        <span class="texto">Esto solamente es una parte, la verdadera flor amarilla está por venir ((:</span>
        <p class="firma">— Te quiere y adora, Marti</p>
      </div>

      <div class="foto" aria-hidden="true">
        <div class="ventana">
          <div class="carita" style="--d: 64px">
            <div class="cachete izq"></div>
            <div class="cachete der"></div>
            <div class="ojo izq"></div>
            <div class="ojo der"></div>
            <div class="pico"></div>
          </div>
        </div>
      </div>

      <div class="cuerpo"></div>
      <div class="tapa dos"></div>
      <div class="tapa uno"></div>
      <div class="sello"></div>
    </label>
  </div>

  <script src="script.js"></script>
</body>
</html>
